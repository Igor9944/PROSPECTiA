services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////app/data/prospection.db
      SECRET_KEY: changethisintheproduction
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      AI_PROVIDER: none
      SEED_ON_START: "true"
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:4173
    volumes:
      - ./backend:/app
      - ./backend/data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - backend
