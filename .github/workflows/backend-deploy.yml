name: Deploy Backend to Render

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'requirements.txt'
      - 'alembic/**'
      - 'docker-compose.yml'
      - 'backend/Dockerfile'
      - 'backend/mise.toml'
      - 'backend/pytest.ini'
      - 'backend/seed.py'
      - 'backend/.env.example'
      - 'backend/app/**'
      - 'backend/tests/**'
      - 'backend/core/**'
      - 'backend/services/**'
      - 'backend/schemas/**'
      - 'backend/routers/**'
      - 'backend/db/**'
      - 'backend/dependencies/**'
      - 'backend/models/**'
      - 'backend/alembic/versions/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run tests
        run: |
          cd backend
          pytest -v

      - name: Deploy to Render
        # This is a placeholder - you'll need to add your Render service details
        # You can use Render's API or a webhook trigger
        # For now, we'll just echo a message
        run: |
          echo "Deploying backend to Render..."
          echo "To automate this, you need to:"
          echo "1. Create a Render service connected to this repo"
          echo "2. Add RENDER_SERVICE_ID and RENDER_API_KEY as GitHub secrets"
          echo "3. Uncomment and configure the Render deploy step below"
          #
          # Example Render deploy (uncomment to use):
          # curl -X POST \
          #   -H "Accept: application/json" \
          #   -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
          #   -H "Content-Type: application/json" \
          #   -d '{"serviceId": "${{ secrets.RENDER_SERVICE_ID }}"}'
          #   https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys