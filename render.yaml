services:
  - type: web
    name: prospectia-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: prospectia-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://igor9944.github.io,http://localhost:5173,http://localhost:3000,http://localhost:4173
      - key: SEED_ON_START
        value: "true"
      - key: AI_PROVIDER
        value: none
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"

databases:
  - name: prospectia-db
    plan: free
